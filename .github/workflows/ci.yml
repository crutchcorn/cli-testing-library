name: ci

on:
  workflow_dispatch:
  push:
    branches: [main, alpha, beta]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions: {}

jobs:
  test:
    name: Test
    if: github.repository == 'crutchcorn/cli-testing-library'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Tools
        uses: tanstack/config/.github/setup@7bbdf583c2fc1a7f596283cd01e0e44c43f574f2 # main
      - name: Run Tests
        run: pnpm run test:ci --parallel=3

  keyboard-portability:
    name: Keyboard portability
    permissions:
      contents: read
    uses: ./.github/workflows/keyboard-portability.yml

  release:
    name: Release
    if: github.repository == 'crutchcorn/cli-testing-library' && github.ref_name == 'main'
    needs: [test, keyboard-portability]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup npm Trusted Publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Create release pull request or publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          branch: main
          commit: "chore: version packages"
          commitMode: github-api
          publish: pnpm run release
          title: "chore: version packages"
          version: pnpm run version-packages
